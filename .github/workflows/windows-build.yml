name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to rebuild and publish (leave empty for build only)"
        required: false
        type: string
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Windows-x64
          - os: macos-15
            artifact: macOS-arm64
          - os: macos-15-intel
            artifact: macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[packaging]"
      - run: python -m unittest discover -s tests -q
      - name: Build and launch-test native application
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: AcademicClipboard-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
            build/desktop-smoke.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify all release packages
        working-directory: artifacts/dist
        run: |
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 3
          sha256sum --check *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/dist/*.zip
            artifacts/dist/*.dmg
            artifacts/dist/*.sha256
