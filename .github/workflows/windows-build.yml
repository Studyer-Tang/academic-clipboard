name: Windows portable app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[packaging]"
      - run: python scripts/build_icon.py
      - name: Build terminal-free executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name AcademicClipboard
          --icon build-assets/academic-clipboard.ico
          --paths src
          --collect-submodules pystray
          src/academic_clipboard/__main__.py
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/AcademicClipboard.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AcademicClipboard.exe" | Set-Content "dist/AcademicClipboard.exe.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: AcademicClipboard-windows-x64
          path: |
            dist/AcademicClipboard.exe
            dist/AcademicClipboard.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AcademicClipboard.exe
            dist/AcademicClipboard.exe.sha256
          generate_release_notes: true
